name: Python bindings
on: [push, pull_request]

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build OpenFHE
        run: |
          git clone --depth 1 --branch v1.6.1 --recurse-submodules https://github.com/openfheorg/openfhe-development.git /tmp/openfhe
          cmake -S /tmp/openfhe -B /tmp/openfhe-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/fhe -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_UNITTESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DWITH_OPENMP=OFF
          cmake --build /tmp/openfhe-build -j 2
          cmake --install /tmp/openfhe-build
      - name: Build ComputeFHE
        env:
          CPATH: /tmp/fhe/include
        run: |
          cmake -S . -B /tmp/compute-fhe-build \
            -DCMAKE_PREFIX_PATH=/tmp/fhe -DCMAKE_INSTALL_PREFIX=/tmp/fhe \
            -DCMAKE_BUILD_TYPE=Release -DCLANG_FORMAT=CLANG_FORMAT-NOTFOUND
          cmake --build /tmp/compute-fhe-build --target computefhe -j 2
          cmake --install /tmp/compute-fhe-build
      - name: Install and test
        env:
          CMAKE_PREFIX_PATH: /tmp/fhe
          LD_LIBRARY_PATH: /tmp/fhe/lib
          COMPUTEFHE_TEST_CRYPTO: '1'
        run: |
          python -m pip install ./python
          python -m unittest discover -s python/tests -v
          python python/examples/quickstart.py --simulation
